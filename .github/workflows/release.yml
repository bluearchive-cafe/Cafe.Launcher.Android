name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ]; then
            echo "ANDROID_SIGNING_KEYSTORE_BASE64 secret is required" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build distribution artifacts
        env:
          ANDROID_SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: .\scripts\Build-Distribution.ps1 -Tag "${{ github.ref_name }}"

      - name: Prepare changelog
        run: |
          if (Test-Path "CHANGELOG_RELEASE.md") {
            Copy-Item "CHANGELOG_RELEASE.md" "changelog.md"
            Write-Host "Using maintained CHANGELOG_RELEASE.md"
          } else {
            $lastTag = git describe --tags --abbrev=0 ${{ github.ref }}^ 2>$null
            $parameters = @{
              CurrentRef = "${{ github.ref }}^"
              OutputPath = "changelog.md"
            }
            if ($lastTag) {
              Write-Host "Last tag: $lastTag"
              $parameters.PreviousTag = $lastTag
            } else {
              Write-Host "No previous tag — using all commits"
            }
            .\scripts\New-ReleaseChangelog.ps1 @parameters
            Write-Host "Fallback changelog generated"
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: changelog.md
          files: |
            artifacts/distribution/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
